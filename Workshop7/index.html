<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Workshop 7: Simple Shopping Cart</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 40px 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f6f8; 
        }

        .card {
            padding: 40px;
            border-radius: 24px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 650px;
        }

        h1 {
            color: #334155;
            margin-bottom: 20px;
            font-size: 1.6rem;
            font-weight: 600;
        }

        /* โซนปุ่มเลือกเมนูกาแฟ */
        .menu-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .menu-btn {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background-color: #ffffff;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-btn:hover {
            background-color: #64748b;
            color: #ffffff;
            border-color: #64748b;
        }

        /* ตารางตะกร้าสินค้า */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            color: #64748b;
            padding: 12px;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #f1f5f9;
            color: #475569;
            vertical-align: middle;
        }

        /* ปุ่มบวกลบปริมาณ Qty */
        .qty-control {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .qty-btn {
            padding: 2px 8px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #64748b;
        }

        .qty-btn:hover {
            background-color: #f1f5f9;
        }

        /* ปุ่มลบสินค้า (Action) */
        .del-btn {
            background-color: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .del-btn:hover {
            background-color: #fca5a5;
        }

        /* ราคารวมด้านล่าง */
        .total-section {
            margin-top: 25px;
            text-align: right;
            color: #334155;
        }

        #taskList { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Shopping Cart</h1>
<div class="menu-group">
    <button class="menu-btn" data-name="Latte" data-price="55">☕ Latte ($55)</button>
    <button class="menu-btn" data-name="Espresso" data-price="50">☕ Espresso ($50)</button>
    <button class="menu-btn" data-name="Americano" data-price="45">🥤 Americano ($45)</button>
    <button class="menu-btn" data-name="Cappuccino" data-price="60">🥛 Cappuccino ($60)</button>
</div>
        
        <h1>Items in Cart</h1>
        <!-- แท็กจำลองตามเงื่อนไขใบงาน -->
        <ul id="taskList"></ul>

        <!-- ตารางแสดงสินค้าตามดีไซน์ Advanced ในหน้าสไลด์ -->
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cartBody">
                <!-- รายการสินค้าจะเด้งมาโชว์ที่นี่ -->
            </tbody>
        </table>

        <div class="total-section">
            <h2>Total: $<span id="total">0</span></h2>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
