<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Workshop 6: Interactive To-do List</title>
    <style>

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f6f8; 
        }

        /* กล่องการ์ดหลัก */
        .card {
            padding: 40px;
            border-radius: 24px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 480px;
        }

        h1 {
            color: #334155;
            margin-bottom: 25px;
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
        }

        /* ส่วนกล่องกรอกข้อมูลและปุ่ม */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            color: #334155;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 4px rgba(100, 116, 139, 0.1);
        }

        button.add-btn {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background-color: #64748b; 
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.15);
            transition: all 0.2s;
        }

        button.add-btn:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        /* รายการภารกิจ (ul) */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 280px;
            overflow-y: auto;
        }

        /* แถวภารกิจแต่ละอัน (li) */
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f8fafc;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        /* ฝั่งซ้าย: กล่องติ๊กและข้อความ */
        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #475569;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }


        .completed span {
            text-decoration: line-through;
            color: #94a3b8;
        }

        /* ปุ่มลบ (ถังขยะ) */
        .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            color: #ef4444;
            background-color: #fee2e2;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Task Management System</h1>
        
        <div class="input-group">

            <input id="task" type="text" placeholder="ใส่ชื่อภารกิจ">
            <button class="add-btn" id="addBtn">Add</button>
        </div>
        

        <ul id="taskList"></ul>
    </div>


    <script>
        const taskInput = document.getElementById('task');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        if (addBtn && taskInput && taskList) {
            // 1. ฟังก์ชันเพิ่มภารกิจใหม่ (Add a Task)
            addBtn.addEventListener('click', function() {
                const taskText = taskInput.value.trim();
                
                if (taskText === "") {
                    alert("กรุณากรอกชื่อภารกิจก่อนครับ");
                    return;
                }

                // สร้างโครงสร้างแถว <li> แบบไดนามิก
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="task-content">
                        <input type="checkbox" class="task-checkbox">
                        <span>${taskText}</span>
                    </div>
                    <button class="delete-btn">🗑️</button>
                `;

                // เอาไปต่อในรายการหลัก
                taskList.appendChild(li);
                
                // ล้างช่องป้อนคำ
                taskInput.value = "";
                taskInput.focus();
            });

            // 2. ใช้ Event Delegation ดักจับการคลิกในกล่องรายการทั้งหมด
            taskList.addEventListener('click', function(event) {
                const target = event.target;

                // กรณีที่ 1: ติ๊กถูกทำงานเสร็จ (Toggle completed class)
                if (target.classList.contains('task-checkbox')) {
                    // หาแท็ก li ที่ครอบอยู่ แล้วสั่งเปิด-ปิดคลาส completed
                    const liRow = target.closest('li');
                    if (liRow) {
                        liRow.classList.toggle('completed');
                    }
                }

                // กรณีที่ 2: กดปุ่มลบ (Delete Task โดยใช้ DOM Traversal)
                if (target.classList.contains('delete-btn')) {
                    // ใช้ parentNode ไต่ขึ้นไปหาแท็ก li แถวนั้น แล้วลบทิ้งออกจากหน้าจอ
                    const parentRow = target.parentNode;
                    if (parentRow) {
                        parentRow.remove();
                    }
                }
            });
        }
    </script>
</body>
</html>
