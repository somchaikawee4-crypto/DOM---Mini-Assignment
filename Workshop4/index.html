<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Workshop 4: Student Grade Checker</title>
    <style>
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f6f8; 
        }

        /* กล่องการ์ดเนื้อหา */
        .card {
            text-align: center;
            padding: 40px;
            border-radius: 24px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            color: #334155; 
            margin-bottom: 25px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        /* จัดกรุ๊ปช่องกรอกข้อมูลและปุ่ม */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        /* ช่องใส่คะแนน */
        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
            color: #334155;
        }

        input[type="text"]:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 4px rgba(100, 116, 139, 0.1);
        }

        /* ปุ่มกดดีไซน์นุ่มนวล */
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background-color: #64748b;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.15);
            transition: all 0.2s;
        }

        button:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        /* แถบโชว์เกรดแบบ Soft & Cozy */
        .grade-box {
            background-color: #f1f5f9;
            color: #475569;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>มหาวิทยาลัยราชภัฏนครปฐม</h1>
        
        <div class="input-group">
            <input id="score" type="text" placeholder="ใส่คะแนนเพื่อคำนวณเกรด">
            <button id="submitBtn">Check</button>
        </div>
        
        <h1 id="grade" class="grade-box">Grade: -</h1>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
