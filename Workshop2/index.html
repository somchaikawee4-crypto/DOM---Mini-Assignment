<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Workshop 2: Text Modifier</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3f4f6;
        }

        /* ตกแต่งการ์ดเนื้อหาตรงกลาง */
        .card {
            text-align: center;
            padding: 50px 60px;
            border-radius: 24px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* ตกแต่งข้อความ */
        h1 {
            color: #1f2937;
            margin-bottom: 35px;
            font-size: 2.3rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        /* ดีไซน์ปุ่มกดสวยๆ */
        button { 
            padding: 14px 36px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            border: none;
            border-radius: 14px;
            background-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
            transition: all 0.25s ease;
        }

        /* เอฟเฟกต์ตอนเอาเมาส์ไปชี้ */
        button:hover {
            background-color: #4338ca;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }

        /* เอฟเฟกต์ตอนกดปุ่ม */
        button:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ใส่ id="textTitle" ไว้ให้ JS จัดการเปลี่ยนคำ -->
        <h1 id="textTitle">มหาวิทยาลัยราชภัฏนครปฐม</h1>
        
        <!-- ใส่ id="changeBtn" เพื่อดักจับตอนกดคลิก -->
        <button id="changeBtn">เปลี่ยนข้อความ</button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
